[project]
name = "translator-memory-engine"
version = "0.1.0"
description = "Translator memory engine that extracts named-entity/terminology/honorific policies from good-translated + MTL web-novel text"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "spacy>=3.7",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "fastembed>=0.3.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
]

[project.scripts]
translator-memory-engine = "pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["translator_memory_engine"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
